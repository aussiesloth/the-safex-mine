<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="435"
     height="145"
     viewBox="0 0 435 145"
     role="img"
     aria-labelledby="safex_wordmark_title">
  <title id="safex_wordmark_title">Safex</title>

  <defs>
    <linearGradient id="safex_wordmark_gradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" stop-color="#39F3A6"/>
      <stop offset="48%" stop-color="#39E9C2"/>
      <stop offset="100%" stop-color="#4EDCFF"/>
    </linearGradient>

    <mask id="safex_wordmark_mask"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="435"
          height="145">
      <image x="0"
             y="0"
             width="435"
             height="145"
             preserveAspectRatio="xMidYMid meet"
             href="data:image/png;base64,"
             xlink:href="data:image/png;base64,"/>
    </mask>
  </defs>

  <rect x="0"
        y="0"
        width="435"
        height="145"
        fill="url(#safex_wordmark_gradient)"
        mask="url(#safex_wordmark_mask)"/>
</svg>
